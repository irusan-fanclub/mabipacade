name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to publish (e.g. v0.1.0-test)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show dotnet info
        run: dotnet --info

      - name: Build, publish, pack
        shell: pwsh
        run: ./scripts/publish.ps1 -SkipTests

      - name: Compute tag name
        id: tag
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -match '^v.*') { $env:GITHUB_REF_NAME }
                 else { '${{ inputs.tag }}' }
          "name=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "tag=$tag"

      - name: Zip exe artifacts
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.name }}'
          New-Item -ItemType Directory -Force -Path artifacts/zip | Out-Null
          Compress-Archive -Path artifacts/cli/*     -DestinationPath "artifacts/zip/mabipacade-cli-$tag-win-x64.zip"
          Compress-Archive -Path artifacts/server/*  -DestinationPath "artifacts/zip/mabipacade-server-$tag-win-x64.zip"
          Compress-Archive -Path artifacts/debugui/* -DestinationPath "artifacts/zip/mabipacade-debugui-$tag-win-x64.zip"
          Get-ChildItem artifacts/zip,artifacts/nupkg | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/zip/*.zip
            artifacts/nupkg/*.nupkg
            artifacts/nupkg/*.snupkg
